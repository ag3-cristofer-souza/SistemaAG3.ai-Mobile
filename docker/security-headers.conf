# Incluído em cada `location`: no nginx, `add_header` dentro de um location anula os herdados do server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), payment=(), camera=(self), microphone=(self)" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# 'wasm-unsafe-eval': codificador de áudio. googleapis.com: registro no FCM. Imagens e mídia vêm do storage (https:).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.ag3system.com wss://api.ag3system.com https://*.googleapis.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
